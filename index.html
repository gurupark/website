<title>홈페이지 점검 중 | 패시브하우스 전남포럼</title>
<meta name="description" content="패시브하우스 전남포럼 홈페이지를 점검하고 있습니다. 잠시 후 다시 방문해 주세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
:root{
  --bg:#FFFFFF; --ink:#1F2328; --muted:#4B5560; --line:#D9DDE2; --soft:#F3F4F6;
  --red:#B81820; --orange:#F09800; --on-red:#FFFFFF; --foot-bg:#1F2328; --foot-ink:#F3F4F6; --foot-muted:#B7BEC6;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:17px;line-height:1.7;word-break:keep-all}
a{color:inherit}
a:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.page{min-height:100%;display:flex;flex-direction:column}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px;width:100%}

header{border-bottom:1px solid var(--line)}
header .wrap{padding-top:12px;padding-bottom:12px}
.logo{display:inline-flex;align-items:center;min-height:44px;border-radius:4px}
.logo img{display:block;height:44px;width:auto;max-width:100%}

main{flex:1;display:flex;align-items:center}
main .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:48px 72px;padding-top:72px;padding-bottom:88px}
.copy{flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:24px;max-width:560px}
.status{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:600;color:var(--red)}
.status i{width:10px;height:10px;border-radius:50%;background:var(--red);display:block}
h1{margin:0;font-family:'Noto Serif KR',serif;font-weight:700;font-size:46px;line-height:1.28;text-wrap:balance}
.lead{margin:0;color:var(--muted);max-width:30em}
.contact{margin-top:8px;border-top:1.5px solid var(--ink);padding-top:20px;display:flex;flex-direction:column;gap:14px}
.contact p{margin:0}
.btn{display:inline-flex;align-items:center;align-self:flex-start;min-height:48px;padding:0 24px;background:var(--red);color:var(--on-red);font-weight:600;border-radius:4px;text-decoration:none;overflow-wrap:anywhere}
.btn:hover{filter:brightness(1.08)}

.figure{flex:1 1 360px;min-width:0;display:flex;justify-content:center}
.figure svg{width:100%;max-width:440px;height:auto;display:block}
.wall{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.ins{fill:var(--orange);opacity:.9}
.ins-gap{fill:var(--orange);opacity:.22}
.air{fill:none;stroke:var(--red);stroke-width:3;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 2.6s ease-out .4s forwards}
.ground{stroke:var(--ink);stroke-width:2}
.hatch line{stroke:var(--line);stroke-width:1.5}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.air{animation:none;stroke-dashoffset:0}}

footer{background:var(--foot-bg);color:var(--foot-ink)}
footer .wrap{padding-top:32px;padding-bottom:32px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 32px;font-size:14px}
footer .name{font-family:'Noto Serif KR',serif;font-weight:700;font-size:18px}
footer .meta{color:var(--foot-muted)}

@media (max-width:600px){
  h1{font-size:32px}
  main .wrap{padding-top:48px;padding-bottom:64px}
  .figure{order:-1}
  .figure svg{max-width:300px}
}
</style>
</head>
